services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon_booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/salon_booking
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      args:
        DOPPLER_TOKEN: ${DOPPLER_TOKEN_CLIENT}
    ports:
      - "3001:3000"
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN_CLIENT}
    depends_on:
      - server
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http server:3000 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:

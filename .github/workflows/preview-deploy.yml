# Creates a Railway preview environment for each pull request.
# Cleans up the environment when the PR is closed.
#
# Required secrets:
#   - RAILWAY_API_TOKEN: Railway API token (not a project token — needs account-level access)
#   - RAILWAY_PROJECT_ID: Railway project ID

name: Preview Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy preview environment
        id: deploy
        uses: ayungavis/railway-preview-deploy@v1.0.2
        with:
          railway_api_token: ${{ secrets.RAILWAY_API_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment_name: "dev"
          preview_environment_name: "pr-${{ github.event.pull_request.number }}"
          branch_name: ${{ github.head_ref }}
          api_service_name: "salon-booking-api"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const domain = '${{ steps.deploy.outputs.service_domain }}';
            const body = `**Railway Preview Deployed**\n\nURL: https://${domain}\nEnvironment: \`pr-${{ github.event.pull_request.number }}\``;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Railway Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove preview environment
        uses: ayungavis/railway-preview-deploy@v1.0.2
        with:
          railway_api_token: ${{ secrets.RAILWAY_API_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          environment_name: "dev"
          preview_environment_name: "pr-${{ github.event.pull_request.number }}"
          branch_name: ${{ github.head_ref }}
          cleanup: true

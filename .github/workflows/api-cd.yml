# This workflow builds the server Docker image and pushes it to Docker Hub.
# Railway is configured to deploy from the Docker Hub image automatically.
#
# Required GitHub Actions secrets:
#   - DOCKERHUB_USERNAME: Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token

name: API CD

on:
  push:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Push Server Image (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: dev
            environment: development
            tag: dev
          - branch: staging
            environment: staging
            tag: staging
          - branch: main
            environment: production
            tag: latest
    if: github.ref_name == matrix.branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/salon-booking-server:${{ matrix.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/salon-booking-server:${{ matrix.tag }}-${{ github.sha }}
